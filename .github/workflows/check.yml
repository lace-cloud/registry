# .github/workflows/check.yml
name: check
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lace-cloud/registry-check@v1
        with:
          api-url: ${{ github.base_ref == 'main' && 'https://lace.cloud' || 'https://preview.lace.cloud' }}
