name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'scanners/**'
      - 'run-tasks/**'
      - 'chaos-providers/**'
  workflow_dispatch:
    inputs:
      manifest_dir:
        description: 'Manifest dir (e.g., scanners/lace/aws-drift)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LACE_ORG_CI_APP_ID }}
          private-key: ${{ secrets.LACE_ORG_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check platform-team membership
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STATUS=$(gh api \
            "orgs/${{ github.repository_owner }}/teams/platform-team/memberships/${{ github.actor }}" \
            --jq '.state' 2>/dev/null || echo "not_found")
          if [ "$STATUS" != "active" ]; then
            echo "::error::@${{ github.actor }} is not a member of @${{ github.repository_owner }}/platform-team. Manual dispatch is restricted to platform-team members."
            exit 1
          fi
          echo "Authorized: @${{ github.actor }} is an active platform-team member"

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: authorize
    if: always() && (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')

    outputs:
      manifests_json: ${{ steps.resolve.outputs.manifests_json }}
      manifests_found: ${{ steps.resolve.outputs.manifests_found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve manifests
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DIR="${{ inputs.manifest_dir }}"
            [ -d "$DIR" ]               || { echo "::error::Directory not found: $DIR"; exit 1; }
            [ -f "$DIR/manifest.yaml" ] || { echo "::error::manifest.yaml missing in $DIR"; exit 1; }
            echo "Manual trigger: $DIR"
            echo "manifests_json=[\"$DIR\"]" >> $GITHUB_OUTPUT
            echo "manifests_found=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          changed=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
            | grep -E '^(modules|scanners|run-tasks|chaos-providers)/' || true)
          if [ -z "$changed" ]; then
            echo "No manifest changes detected"
            echo "manifests_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          find_manifest_root() {
            local dir
            dir=$(dirname "$1")
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              [ -f "$dir/manifest.yaml" ] && echo "$dir" && return 0
              dir=$(dirname "$dir")
            done
            return 1
          }

          dirs=""
          for f in $changed; do
            root=$(find_manifest_root "$f") && dirs="$dirs$root"$'\n'
          done

          unique=$(echo "$dirs" | sort -u | sed '/^$/d')
          if [ -z "$unique" ]; then
            echo "No publishable manifests found"
            echo "manifests_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Manifests to publish:"
          echo "$unique"
          json=$(echo "$unique" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "manifests_json=$json" >> $GITHUB_OUTPUT
          echo "manifests_found=true" >> $GITHUB_OUTPUT

  register:
    name: Register
    runs-on: ubuntu-latest
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.manifests_found == 'true'

    strategy:
      matrix:
        manifest_dir: ${{ fromJson(needs.prepare.outputs.manifests_json) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Lace CLI
        run: |
          wget -q https://releases.lace.cloud/lace-cli-linux-amd64 -O lace
          chmod +x lace && sudo mv lace /usr/local/bin/lace

      - name: Authenticate
        env:
          LACE_REGISTRY_KEY: ${{ secrets.LACE_REGISTRY_KEY }}
        run: |
          [ -z "$LACE_REGISTRY_KEY" ] && { echo "::error::LACE_REGISTRY_KEY secret not set"; exit 1; }
          lace whoami

      - name: Resolve axis
        id: axis
        run: |
          DIR="${{ matrix.manifest_dir }}"
          AXIS_DIR=$(echo "$DIR" | cut -d/ -f1)
          case "$AXIS_DIR" in
            modules)         AXIS=module ;;
            scanners)        AXIS=scanner ;;
            run-tasks)       AXIS=run_task ;;
            chaos-providers) AXIS=chaos_provider ;;
            *)               echo "::error::Unknown axis dir: $AXIS_DIR"; exit 1 ;;
          esac
          echo "axis=$AXIS" >> $GITHUB_OUTPUT

      - name: Register
        env:
          LACE_REGISTRY_KEY: ${{ secrets.LACE_REGISTRY_KEY }}
        run: |
          DIR="${{ matrix.manifest_dir }}"
          AXIS="${{ steps.axis.outputs.axis }}"
          README_FLAG=""
          [ -f "$DIR/README.md" ] && README_FLAG="--readme $DIR/README.md"
          lace registry register \
            --axis "$AXIS" \
            --manifest "$DIR/manifest.yaml" \
            $README_FLAG

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [prepare, register]
    if: always()

    steps:
      - name: Report
        run: |
          echo "# Registry Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.prepare.outputs.manifests_found }}" != "true" ]; then
            echo "No manifest changes detected." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Manifests" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.prepare.outputs.manifests_json }}' \
            | jq -r '.[] | "- `" + . + "`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.register.result }}" = "success" ]; then
            echo "**Result:** All manifests registered." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.register.result }}" = "failure" ]; then
            echo "**Result:** Registration failed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** ${{ needs.register.result }}" >> $GITHUB_STEP_SUMMARY
          fi
