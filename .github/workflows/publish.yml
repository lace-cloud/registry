# .github/workflows/publish.yml
name: publish
on:
  push:
    branches: [main, develop]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lace-cloud/registry-publish@v1
        with:
          token: ${{ github.ref_name == 'main' && secrets.LACE_TOKEN || secrets.LACE_TOKEN_PREVIEW }}
          api-url: ${{ github.ref_name == 'main' && 'https://lace.cloud' || 'https://preview.lace.cloud' }}
