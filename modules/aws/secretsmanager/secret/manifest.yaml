apiVersion: '1'
axis: module
author: lace
name: secretsmanager-secret
version: v1.0.0
displayName: "AWS Secrets Manager Secret"
description: "AWS Secrets Manager secret with optional initial value and KMS encryption"
categories: [security, secrets, secretsmanager]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/secretsmanager/secret
  gitUrl: https://github.com/lace-cloud/registry.git
  gitTag: v1.0.0
  example: |
    module "api_key_secret" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/secretsmanager/secret?ref=v1.0.0"

      name        = "my-app/prod/api-key"
      description = "API key for third-party service"

      tags = {
        Environment = "production"
      }
    }
