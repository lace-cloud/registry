apiVersion: '1'
axis: module
author: lace
name: rds-subnet-group
version: v1.0.0
displayName: "AWS RDS Subnet Group"
description: "AWS RDS DB subnet group for placing RDS instances within a VPC"
categories: [database, rds, networking]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/rds/subnet_group
  example: |
    module "rds_subnet_group" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/rds/subnet_group?ref=v1.0.0"

      name       = "my-app-prod-rds"
      subnet_ids = module.vpc.private_subnet_ids

      tags = {
        Environment = "production"
      }
    }
