apiVersion: '1'
axis: module
author: lace
name: iam-policy
version: v1.0.0
displayName: "AWS IAM Policy"
description: "AWS IAM policy with configurable policy document and tags"
categories: [iam, security, permissions]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/iam/policy
  example: |
    module "policy" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/iam/policy?ref=v1.0.0"

      policy_name = "my-s3-read-policy"

      policy_document = jsonencode({
        Version = "2012-10-17"
        Statement = [
          {
            Action   = ["s3:GetObject", "s3:ListBucket"]
            Effect   = "Allow"
            Resource = ["arn:aws:s3:::my-bucket", "arn:aws:s3:::my-bucket/*"]
          }
        ]
      })

      tags = {
        Environment = "production"
      }
    }
