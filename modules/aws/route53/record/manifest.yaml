apiVersion: '1'
axis: module
author: lace
name: route53-record
version: v1.0.0
displayName: "AWS Route53 Record"
description: "AWS Route53 DNS record supporting both standard and alias record types"
categories: [route53, dns, networking]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/route53/record
  example: |
    module "dns_record" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/route53/record?ref=v1.0.0"

      zone_id = data.aws_route53_zone.main.zone_id
      name    = "my-app.example.com"
      type    = "A"

      alias = {
        name                   = module.alb.dns_name
        zone_id                = module.alb.zone_id
        evaluate_target_health = true
      }
    }
