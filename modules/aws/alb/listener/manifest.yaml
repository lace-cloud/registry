apiVersion: '1'
axis: module
author: lace
name: alb-listener
version: v1.0.0
displayName: "AWS ALB Listener"
description: "AWS ALB listener with default action and optional SSL certificate"
categories: [networking, load-balancing, alb]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/alb/listener
  example: |
    module "listener" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/alb/listener?ref=v1.0.0"

      load_balancer_arn = module.alb.arn
      port              = 443
      protocol          = "HTTPS"
      ssl_policy        = "ELBSecurityPolicy-2016-08"
      certificate_arn   = "arn:aws:acm:us-east-1:123456789012:certificate/abc-123"

      default_action_type             = "forward"
      default_action_target_group_arn = module.target_group.arn

      tags = {
        Environment = "production"
      }
    }
