apiVersion: '1'
axis: module
author: lace
name: cognito-user-pool-client
version: v1.0.0
displayName: "AWS Cognito User Pool Client"
description: "AWS Cognito user pool app client with configurable OAuth flows, scopes, and token validity"
categories: [cognito, auth, security]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/cognito/user_pool_client
  gitUrl: https://github.com/lace-cloud/registry.git
  gitTag: v1.0.0
  example: |
    module "user_pool_client" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/cognito/user_pool_client?ref=v1.0.0"

      name         = "my-app-prod-alb-client"
      user_pool_id = module.user_pool.id

      generate_secret      = true
      allowed_oauth_flows  = ["code"]
      allowed_oauth_scopes = ["openid", "email", "profile"]

      callback_urls = ["https://my-app.example.com/oauth2/idpresponse"]
      logout_urls   = ["https://my-app.example.com"]
    }
