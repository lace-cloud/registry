apiVersion: '1'
axis: module
author: lace
name: cognito-user-pool
version: v1.0.0
displayName: "AWS Cognito User Pool"
description: "AWS Cognito user pool with configurable password policy and email verification"
categories: [cognito, auth, security]
configSchema:
  type: object
  additionalProperties: true
runtime:
  location: lace-managed
authors: ["Lace Team <team@lace.cloud>"]
bundle:
  system: aws
  modulePath: modules/aws/cognito/user_pool
  gitUrl: https://github.com/lace-cloud/registry.git
  gitTag: v1.0.0
  example: |
    module "user_pool" {
      source = "git::https://github.com/lace-cloud/registry.git//modules/aws/cognito/user_pool?ref=v1.0.0"

      name = "my-app-prod-users"

      username_attributes      = ["email"]
      auto_verified_attributes = ["email"]

      tags = {
        Environment = "production"
      }
    }
