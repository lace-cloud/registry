apiVersion: '1'
axis: chaos_provider
author: lace
name: aws
version: v1.0.0
displayName: "AWS Chaos Provider"
description: "Lace's first-party chaos provider for AWS. Mutates tags on EC2 instances; rolls back via inverse_action restoring the pre-mutation tag value."
categories: [chaos, aws]
configSchema:
  type: object
  properties:
    region:
      type: string
      description: "AWS region the chaos action targets. Inherited from the install when omitted."
  additionalProperties: false
runtime:
  location: lace-managed
  handlerId: lace/aws
authors: ["Lace Team <team@lace.cloud>"]
targetCatalog:
  targets:
    - resourceType: aws_instance
      uriPattern: "arn:aws:ec2:{region}:{accountId}:instance/{instanceId}"
      actions: [mutate_tag]
      rollbackKinds: [inverse_action]
callbackSigning:
  kind: none
