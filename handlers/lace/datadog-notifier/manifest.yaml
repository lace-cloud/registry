apiVersion: '1'
axis: handler
author: lace
name: datadog-notifier
version: v1.0.2
displayName: Datadog Run Notifier
description: Posts a Datadog event with run summary after each Run completes.
categories:
  - observability
  - notification
runtime:
  location: in-tree
  handlerId: lace/datadog-notifier
  installSecret: required
verdictMode: sync
timeoutSeconds: 10
signing:
  kind: none
hooks:
  available:
    - post_apply
  default:
    - post_apply
configSchema:
  type: object
  properties:
    site:
      type: string
      enum: [us1, us3, us5, eu1, us1-fed]
      default: us1
    tags:
      type: array
      items: { type: string }
      default: []
    alertOnFailure:
      type: boolean
      default: true
