apiVersion: '1'
axis: handler
author: lace
name: snyk-bridge
version: v1.0.2
displayName: Snyk SAST Bridge
description: Reads plan-diff for Snyk-relevant resources and gates on severity threshold.
categories:
  - security
  - sast
  - gating
runtime:
  location: in-tree
  handlerId: lace/snyk-bridge
  installSecret: required
verdictMode: sync
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - post_plan
    - pre_apply
  default:
    - post_plan
configSchema:
  type: object
  required:
    - snykOrgId
  properties:
    snykOrgId:
      type: string
    severityThreshold:
      type: string
      enum: [low, medium, high, critical]
      default: high
    ignoreRules:
      type: array
      items: { type: string }
      default: []
    projectIds:
      type: array
      items: { type: string }
      default: []
    apiHost:
      type: string
      format: uri
      default: https://api.snyk.io
