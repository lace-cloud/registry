apiVersion: '1'
axis: handler
author: lace
name: jsm-change
version: v1.0.3
displayName: Jira Service Management Change
description: Keeps each change request in its scope as a Jira Service Management service-desk request, opened with the change request and closed with it. Bound gating, the request's approval decides the change request's requirement; bound observing, the request follows the change request and holds no Run. The JSM adapter runs in-tree.
categories:
  - governance
  - gating
  - change-management
runtime:
  location: in-tree
  handlerId: lace/jsm-change
verdictMode: async
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - pre_apply
  default:
    - pre_apply
configSchema:
  type: object
  required:
    - externalSystemId
    - externalTemplate
  additionalProperties: false
  properties:
    externalSystemId:
      type: string
      minLength: 1
    externalTemplate:
      type: string
      minLength: 1
    fieldOverrides:
      type: object
