apiVersion: '1'
axis: handler
author: lace
name: glpi-change
version: v1.0.2
displayName: GLPI Change
description: Keeps each change request in its scope as a GLPI Change, opened with the change request and closed with it. Bound gating, the Change's validation decides the change request's requirement; bound observing, the Change follows the change request and holds no Run. The GLPI adapter runs in-tree.
categories:
  - governance
  - gating
  - change-management
runtime:
  location: in-tree
  handlerId: lace/glpi-change
verdictMode: async
timeoutSeconds: 30
signing:
  kind: none
hooks:
  available:
    - pre_apply
  default:
    - pre_apply
configSchema:
  type: object
  required:
    - externalSystemId
    - externalTemplate
  additionalProperties: false
  properties:
    externalSystemId:
      type: string
      minLength: 1
    externalTemplate:
      type: string
      minLength: 1
    fieldOverrides:
      type: object
