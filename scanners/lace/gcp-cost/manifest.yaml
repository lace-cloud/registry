apiVersion: "1"
axis: scanner
author: lace
name: gcp-cost
version: v1.0.2
displayName: GCP Cost Scanner
description: Daily/monthly cost across linked GCP projects from the BigQuery billing export. Emits cost.daily time series and cost.monthly_trend snapshots.
categories:
  - cost
  - gcp
  - finops
provider: gcp
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  snapshots:
    schemas:
      cost.monthly_trend:
        type: object
        additionalProperties: true
  time_series:
    schemas:
      cost.daily:
        granularity: daily
        dimensions:
          - service
          - account
        metrics:
          - ListCost
          - EffectiveCost
authors: []
