apiVersion: "1"
axis: scanner
author: lace
name: aws-drift
version: v1.0.3
displayName: AWS Drift Detection
description: Per-stack Terraform drift detection. Surfaces drift events as findings + drift summary snapshots.
categories:
  - drift
  - aws
provider: aws
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  findings:
    schemas:
      drift-event:
        type: object
        properties:
          stackId:
            type: string
          diff:
            type: array
            items:
              type: object
              additionalProperties: true
          lastAppliedRunId:
            type:
              - string
              - "null"
        required:
          - stackId
        additionalProperties: true
  snapshots:
    schemas:
      drift.summary:
        type: object
        additionalProperties: true
  inventory:
    schemas:
      resources:
        attributesSchema:
          type: object
          properties:
            address:
              type: string
            arn:
              type: string
            dependencies:
              type: array
              items:
                type: string
          required:
            - address
          additionalProperties: true
authors: []
