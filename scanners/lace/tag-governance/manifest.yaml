apiVersion: "1"
axis: scanner
author: lace
name: tag-governance
version: v1.0.0
displayName: Tag Governance
description: Tag-policy compliance on every cloud. Each resource Lace's inventory holds, its AWS tags or Google Cloud labels, is checked against the organization's tag policy. Emits tag-violation findings.
categories:
  - governance
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  findings:
    schemas:
      tag-violation:
        type: object
        additionalProperties: true
authors: []
