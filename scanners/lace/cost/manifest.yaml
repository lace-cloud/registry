apiVersion: "1"
axis: scanner
author: lace
name: cost
version: v1.0.0
displayName: Cost Scanner
description: Daily cost on every cloud the organization holds billing on, read through each billing anchor. Emits cost.daily, cost.attribution_by_team and cost.forecast time series, and cost.monthly_trend snapshots. Requires a billing anchor.
categories:
  - cost
  - finops
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  snapshots:
    schemas:
      cost.monthly_trend:
        type: object
        additionalProperties: true
  time_series:
    schemas:
      cost.daily:
        granularity: daily
        dimensions:
          - service
          - account
        metrics:
          - EffectiveCost
          - BilledCost
      cost.attribution_by_team:
        granularity: daily
        dimensions:
          - teamId
        metrics:
          - EffectiveCost
      cost.forecast:
        granularity: monthly
        dimensions: []
        metrics:
          - forecastAmortizedCost
          - forecastLowerBound
          - forecastUpperBound
authors: []
