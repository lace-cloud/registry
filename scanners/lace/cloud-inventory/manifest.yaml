apiVersion: "1"
axis: scanner
author: lace
name: cloud-inventory
version: v1.0.0
displayName: Cloud Inventory
description: The resources of the account that holds the organization's billing, read through its billing anchor; on AWS, its tagged resources from the Resource Groups Tagging API. Emits the resources inventory and resources.summary snapshots. Requires a billing anchor.
categories:
  - inventory
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  inventory:
    schemas:
      resources:
        attributesSchema:
          type: object
          additionalProperties: true
  snapshots:
    schemas:
      resources.summary:
        type: object
        additionalProperties: true
authors: []
