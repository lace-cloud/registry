apiVersion: "1"
axis: scanner
author: lace
name: health
version: v1.0.0
displayName: Health
description: Alarms in breach in the account that holds the organization's billing, read through its billing anchor; on AWS, CloudWatch metric alarms. Emits alarm-breach findings and health.alarms snapshots. Requires a billing anchor.
categories:
  - health
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  findings:
    schemas:
      alarm-breach:
        type: object
        additionalProperties: true
  snapshots:
    schemas:
      health.alarms:
        type: object
        additionalProperties: true
authors: []
