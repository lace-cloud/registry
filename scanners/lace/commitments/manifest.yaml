apiVersion: "1"
axis: scanner
author: lace
name: commitments
version: v1.0.0
displayName: Commitments Utilization
description: How much of its committed spend the account that holds the organization's billing uses, and the commitments that would cut its on-demand spend, read through its anchor; on AWS, Savings Plans and Reserved Instances from Cost Explorer. Emits commitments.utilization snapshots and commitment-recommendation findings. Requires the cloud account that holds the organization's billing, connected with billing turned on.
categories:
  - cost
  - commitments
  - finops
runtime:
  location: in-tree
configSchema:
  type: object
  properties: {}
  additionalProperties: true
outputs:
  snapshots:
    schemas:
      commitments.utilization:
        type: object
        additionalProperties: true
  findings:
    schemas:
      commitment-recommendation:
        type: object
        additionalProperties: true
authors: []
